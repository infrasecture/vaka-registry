apiVersion: agent.vaka/v1alpha1
kind: ServicePolicy

services:
  codex:
    network:
      egress:
        defaultAction: reject       # accept | reject | drop
        accept:
          - dns: {}  # all entries from /etc/resolv.conf
          - proto: tcp
            to: [litellm]
            ports: [4000]
        drop:
          - proto: icmp
            type: echo-request      # named or numeric (8)
  litellm:
    network:
      egress:
        defaultAction: reject
        accept:
          - dns: {}
          # ChatGPT subscription backend + OAuth device flow only.
          - proto: tcp
            to: [
                chatgpt.com,
                auth.openai.com,
                ]
            ports: [443]
          - proto: icmp
            type: echo-request
