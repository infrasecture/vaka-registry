# LiteLLM config for the ChatGPT-subscription profile. Routes are chatgpt/<model>
# on the Responses API; LiteLLM reads/refreshes the OAuth token from
# CHATGPT_TOKEN_DIR/auth.json (set by overlay.yaml). Models are enumerated
# because the chatgpt/ provider does not support a wildcard route; the
# model_name each client requests must appear here.
model_list:
  - model_name: gpt-5.6-sol
    model_info: { mode: responses }
    litellm_params:
      model: chatgpt/gpt-5.6-sol
  - model_name: gpt-5.6-terra
    model_info: { mode: responses }
    litellm_params:
      model: chatgpt/gpt-5.6-terra
  - model_name: gpt-5.6-luna
    model_info: { mode: responses }
    litellm_params:
      model: chatgpt/gpt-5.6-luna
  - model_name: gpt-5.5
    model_info: { mode: responses }
    litellm_params:
      model: chatgpt/gpt-5.5
  - model_name: gpt-5.2
    model_info: { mode: responses }
    litellm_params:
      model: chatgpt/gpt-5.2

litellm_settings:
  telemetry: False
  # Do not ask LiteLLM's generic parameter layer to silently discard fields.
  # The native ChatGPT Responses adapter forwards the Codex fields exercised by
  # this recipe: reasoning and function, custom, and hosted web-search tools.
  drop_params: False

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: litellm_agent_auth.user_api_key_auth
  custom_auth_run_common_checks: true
