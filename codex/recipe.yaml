apiVersion: recipes.vaka/v1alpha1
kind: Recipe
name: codex
version: 0.3.0
description: Codex agent in an egress-restricted container with a LiteLLM gateway sidecar
homepage: https://github.com/infrasecture/vaka-registry/tree/main/codex
tags: [agent, openai, codex, litellm, chatgpt]
minVakaVersion: 0.0.3
env:
  - name: MYCODEX_AUTH
    required: false
    description: "Auth profile selecting how LiteLLM authenticates upstream: openai (default), chatgpt (subscription), or vertex (scaffold)"
  - name: OPENAI_API_KEY
    required: false
    description: Model provider API key consumed only by LiteLLM in the default openai profile; myCodex also accepts OPENAI_API_KEY_FILE or prompts securely
  - name: MYCODEX_MODEL
    required: false
    description: Optional model pin passed to Codex; auth profiles that enumerate models default it, the openai profile leaves it unset (LiteLLM wildcard)
  - name: LITELLM_MASTER_KEY
    required: false
    description: Optional embedded-gateway key override; myCodex also accepts LITELLM_MASTER_KEY_FILE or generates and persists one
