# Compose overlay for the ChatGPT-subscription profile. Additive over
# docker-compose.yaml: it only teaches the LiteLLM sidecar where to keep the
# OAuth token. The provider config swap is driven by ./myCodex via
# MYCODEX_LITELLM_CONFIG; model selection remains Codex-owned unless the user
# explicitly sets MYCODEX_MODEL.
#
# NOTE: the chatgpt/ provider requires a LiteLLM build that includes it. If the
# pinned base image predates it, pin a chatgpt-capable image here by digest.
services:
  litellm:
    environment:
      CHATGPT_TOKEN_DIR: /var/lib/litellm/chatgpt-token
      CHATGPT_AUTH_FILE: auth.json
    volumes:
      # rw so LiteLLM can mint the token during device login and refresh it later.
      - ./.secrets/chatgpt-token:/var/lib/litellm/chatgpt-token:rw
